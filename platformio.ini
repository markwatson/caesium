; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-poe-iso]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
lib_deps = 
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.28

; Debug build: adds the time-base validation pulse on GPIO33.
; Scope GPIO33 against the PPS on GPIO16 — see TIMEBASE.md.
; The default env above is unaffected.
[env:esp32-poe-iso-timebase]
extends = env:esp32-poe-iso
build_flags = -D TIMEBASE_PULSE
